[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
env =
    TESTING=true
    DATABASE_URL=postgresql+asyncpg://wa:wa@postgres:5432/wa_test
    WEBHOOK_VERIFY_TOKEN=test_verify_token
    MOCK_WHATSAPP=true
    CELERY_TASK_ALWAYS_EAGER=true
    TEST_DB_DSN=postgresql://wa:wa@postgres:5432/wa_marketing
    TEST_REDIS_URL=redis://redis:6379/0
